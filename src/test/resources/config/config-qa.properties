# ============================================================================
# REVISION NOTES — MODULE 3: Why one file per environment instead of
# if/else logic in Java code?
# ============================================================================
# Non-technical folks (or even you, 6 months later) should be able to change
# a URL or a timeout WITHOUT touching Java code or recompiling anything.
# This is the "Config Layer" from our Module 0 architecture diagram.
# Jenkins will pick this exact file automatically via -Denv=qa (Module 10).
# ============================================================================

base.url=https://www.saucedemo.com
browser=chrome
headless=false
implicit.wait.seconds=10
explicit.wait.seconds=20
page.load.timeout.seconds=30
env=qa
